name: Tests

on:
  push:
    branches: [trunk, 'release/**']
  pull_request:

permissions:
  contents: read

jobs:
  changelog:
    name: Changelog entry
    # A PR that changes what ships adds a changelog/ file (see .github/CONTRIBUTING.md);
    # release branches compile and delete them, so they're exempt.
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: An entry when the plugin changes, and every entry well formed
        run: |
          base="origin/${GITHUB_BASE_REF}"
          changed=$(git diff --name-only "$base"...HEAD)
          echo "$changed"
          for f in changelog/*; do
            [ -f "$f" ] && [ "$(basename "$f")" != .gitkeep ] || continue
            sed -n 1p "$f" | grep -Eq '^Significance: (patch|minor|major)$' &&
              sed -n 2p "$f" | grep -Eq '^Type: (add|fix|update|dev)$' &&
              [ -z "$(sed -n 3p "$f")" ] && [ -n "$(sed -n '4,$p' "$f" | tr -d '[:space:]')" ] ||
              { echo "::error file=$f::Expected Significance, Type, a blank line and the entry."; exit 1; }
          done
          if grep -Eq '^(includes/|src/|routes/|templates/|eizport\.php$|uninstall\.php$|readme\.txt$)' <<< "$changed" &&
             ! git diff --name-only --diff-filter=A "$base"...HEAD | grep -q '^changelog/'; then
            echo "::error::This PR changes the plugin: add a changelog/ entry (see .github/CONTRIBUTING.md)."
            exit 1
          fi

  versions:
    name: Versions agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Header, constant and Stable tag
        run: |
          header=$(sed -n 's/^ \* Version: *//p' eizport.php)
          constant=$(sed -n "s/^const VERSION = '\(.*\)';$/\1/p" eizport.php)
          stable=$(sed -n 's/^Stable tag: *//p' readme.txt)
          echo "header=$header constant=$constant stable=$stable"
          [ -n "$header" ] && [ "$header" = "$constant" ]
          # A final: Stable tag is the version. A dev or pre-release (trunk's
          # 1.1.0-dev, 1.1.0-rc.1): Stable tag is a final before its series.
          case "$header" in
            *-*) [[ "$stable" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] && [ "$(printf '%s\n' "$stable" "${header%%-*}" | sort -V | head -n1)" = "$stable" ] && [ "$stable" != "${header%%-*}" ] ;;
            *) [ "$header" = "$stable" ] ;;
          esac

  php:
    name: Lint, PHPCS, PHPUnit and Plugin Check (wp-env)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - name: Install
        run: |
          composer install --no-interaction --prefer-dist
          npm ci

      - name: Lint and PHPCS
        run: composer lint && composer phpcs

      - name: Build the JS
        run: npm run build --if-present

      - name: Start WordPress (wp-env)
        run: npx wp-env start

      # The tests load the wp-env site (WP_LOAD) and never write to its database.
      - name: PHP version (test only)
        run: npx wp-env run tests-cli php -v

      - name: PHPUnit
        run: npx wp-env run tests-cli --env-cwd=wp-content/plugins/eizport bash -c 'WP_LOAD=/var/www/html/wp-load.php vendor/bin/phpunit'

      # languages/eizport.pot must list every string (PHP and the built screens).
      # Parsing the built screens needs more than the container's 128 MB of PHP memory.
      - name: Translation template
        run: npx wp-env run tests-cli --env-cwd=wp-content/plugins/eizport bash -c 'WP="php -d memory_limit=1G $(command -v wp)" bash bin/make-pot.sh --check'

      - name: Plugin Check
        run: |
          npx wp-env run cli wp plugin install plugin-check --activate
          # On what ships: the script leaves out what .distignore does.
          bash bin/plugin-check.sh npx wp-env run cli wp

  multisite:
    name: PHPUnit on a network (wp-env)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - name: Install
        run: |
          composer install --no-interaction --prefer-dist
          npm ci
          npm run build --if-present

      # The tests site becomes a network with a subdirectory subsite, the plugins network-activated.
      - name: Start WordPress as a network (wp-env)
        run: |
          npx wp-env start
          npx wp-env run tests-cli wp core multisite-convert --title="Eizport network"
          npx wp-env run tests-cli wp site create --slug=b --title="Site B"
          npx wp-env run tests-cli wp plugin activate eizport wordpress-importer --network

      - name: PHPUnit on the main site
        run: npx wp-env run tests-cli --env-cwd=wp-content/plugins/eizport bash -c 'WP_LOAD=/var/www/html/wp-load.php vendor/bin/phpunit'

      - name: PHPUnit in a subsite
        run: npx wp-env run tests-cli --env-cwd=wp-content/plugins/eizport bash -c 'WP_LOAD=/var/www/html/wp-load.php WP_TEST_URL=http://localhost:8889/b/ vendor/bin/phpunit'

  js:
    name: JS lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run lint:js --if-present
      - run: npm run check-types --if-present
